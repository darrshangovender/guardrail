[project]
name = "llm-guardrail"
version = "0.1.0"
description = "A safety gateway for LLM inputs and outputs — prompt-injection detection, PII redaction, groundedness checking, and schema repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["llm", "security", "prompt-injection", "pii", "guardrails", "ai-safety", "hallucination"]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/darrshangovender/guardrail"
Issues = "https://github.com/darrshangovender/guardrail/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
